<section class="slide-data" data-section="Context" data-kind="columns">
  <p class="slide-kicker">Context as a cache</p>
  <h2 class="slide-title">Keep the window <em>useful.</em></h2>
  <div class="body columns"><div class="frag"><div><p class="point"><strong>Inline.</strong><br>Put likely-needed information directly in the model context.</p></div></div><div class="frag"><div><p class="point"><strong>Spill.</strong><br>Keep long or rarely needed material outside, with a reference.</p></div></div><div class="frag"><div><p class="point"><strong>Recall.</strong><br>Retrieve the full material when the task requires it.</p></div></div></div>
  <template class="slide-notes">Spill does not mean deleting the original. The goal is to trade context space against extra retrieval calls.</template>
</section>
