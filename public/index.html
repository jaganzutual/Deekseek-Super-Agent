/* Theme tokens for the deck */
#stage{--theme-bg:#F8F7F2;--theme-surface:#FFFFFC;--theme-main:#F2E1AD;--theme-secondary:#CEDFEA;--theme-ink:#353344;--theme-detail:#62572F;--theme-border:#DDDCD2;--theme-glow1:#F2E1AD99;--theme-glow2:#CEDFEA99;--theme-dot:#A6B7BE;--theme-panel:#F2E1AD}
.slide{background:radial-gradient(ellipse 40% 45% at 11% 8%,var(--theme-glow1) 0%,transparent 72%),radial-gradient(ellipse 35% 48% at 96% 90%,var(--theme-glow2) 0%,transparent 72%),var(--theme-bg);color:var(--theme-ink)}
.slide:before{background-image:radial-gradient(var(--theme-dot) .8px,transparent 1px)}
.title,.point strong,.hero h1,.big,.box{color:var(--theme-ink)}.title em,.hero h1 em,.tile .num,.arrow{color:var(--theme-detail)}
.nav button.current,.controls button,.box,.archbox,.rows,.tile,.body.columns>.frag{background:var(--theme-surface);border-color:var(--theme-border)}
.box.accent,.archbox.peach,.tag,.nav button.current{background:var(--theme-panel);border-color:var(--theme-border)}.archbox.sage{background:var(--theme-secondary)}.orb{background:var(--theme-main)}.orb:before{background:var(--theme-surface)}.orb:after{background:var(--theme-secondary)}

</style></head><body><main id="stage"><div id="slides"><p class="loading">Loading slides…</p></div><div class="controls"><button id="prev" aria-label="Previous step">← Back</button><button id="next" aria-label="Next step">Next →</button><button id="overview-btn">Overview</button><button id="notes-btn">Notes</button><button id="fullscreen-btn">Full screen</button></div><div id="notes" class="notes" hidden></div><div id="overview" class="overview" hidden><h2>Explore the deck</h2><button class="close-over" id="close-over">Close</button><div class="overview-grid" id="overview-grid"></div></div></main>
<script>
const sections=['Start','Design','Context','Running','Next'];
const slideFiles=[
'index-01.html',
'journey-02.html',
'problem-03.html',
'shift-04.html',
'characteristics-05.html',
'architecture-06.html',
'two-levels-07.html',
'router-08.html',
'workers-09.html',
'triggers-10.html',
'event-filtering-11.html',
'subscriptions-12.html',
'context-cache-13.html',
'context-example-14.html',
'chain-of-recall-15.html',
'recall-example-16.html',
'memory-limit-17.html',
'full-duplex-18.html',
'channels-19.html',
'persistence-20.html',
'environments-21.html',
'watchdog-22.html',
'evidence-23.html',
'open-questions-24.html',
'takeaway-25.html'
];

let slides=[],index=0,reveal=0;
const $=id=>document.getElementById(id);const stage=$('stage');
function fit(){if(innerWidth<=700){stage.style.transform='none';return}const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`}
window.addEventListener('resize',fit);fit();

async function loadSlides(){
  slides=await Promise.all(slideFiles.map(async file=>{
    const res=await fetch('slides/'+file,{cache:'no-cache'});
    if(!res.ok)throw new Error(file+' returned HTTP '+res.status);
    const doc=new DOMParser().parseFromString(await res.text(),'text/html');
    const root=doc.querySelector('.slide-data');
    if(!root)throw new Error(file+' has no .slide-data section');
    const title=root.querySelector('.slide-title'),kicker=root.querySelector('.slide-kicker'),body=root.querySelector('.body'),notes=root.querySelector('.slide-notes');
    return{
      section:root.dataset.section||'',
      kind:root.dataset.kind||'',
      kicker:kicker?kicker.textContent.trim():'',
      title:title?title.innerHTML.trim():'',
      body:body?body.outerHTML:'',
      notes:notes?notes.innerHTML.trim():''
    };
  }));
}

function show(i,r=0){
  index=Math.max(0,Math.min(slides.length-1,i));
  const s=slides[index];
  $('slides').innerHTML=`<section class="slide active ${['end','architecture'].includes(s.kind)?'serif-heading':''}"><header class="head"><span>${s.section}</span><nav class="nav" aria-label="Presentation sections">${sections.map(name=>`<button data-section="${name}" class="${name===s.section?'current':''}">${name}</button>`).join('')}</nav></header>${s.kind==='hero'?'':`<div class="eyebrow">${s.kicker}</div><h2 class="title">${s.title}</h2>`}${s.body}<footer class="foot"><a href="https://x.com/DeepSeekHarness/status/2116857257245987236" target="_blank" rel="noopener">DeepSeek Super Agent · Article</a><span>${index+1} / ${slides.length}</span></footer><div class="hint">← / → navigate · N notes · O overview · F full screen</div></section>`;
  let fs=[...document.querySelectorAll('.frag')];
  reveal=r==='end'?fs.length:Math.min(r,fs.length);
  fs.forEach((f,j)=>f.classList.toggle('revealed',j<reveal));
  $('prev').disabled=index===0&&reveal===0;
  $('next').disabled=index===slides.length-1&&reveal===fs.length;
  $('notes').innerHTML=`<b>${index+1} / ${slides.length}</b><p>${s.notes}</p>`;
  history.replaceState(null,'','#'+(index+1));
  document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>show(slides.findIndex(x=>x.section===b.dataset.section))));
}

function next(){if(!slides.length)return;let fs=[...document.querySelectorAll('.frag')];if(reveal<fs.length){reveal++;fs[reveal-1].classList.add('revealed');$('prev').disabled=false;if(index===slides.length-1&&reveal===fs.length)$('next').disabled=true}else if(index<slides.length-1)show(index+1)}
function prev(){if(!slides.length)return;let fs=[...document.querySelectorAll('.frag')];if(reveal>0){fs[--reveal].classList.remove('revealed');$('next').disabled=false;if(index===0&&reveal===0)$('prev').disabled=true}else if(index>0)show(index-1,'end')}
function overview(){if(!slides.length)return;const o=$('overview');o.hidden=!o.hidden;if(!o.hidden){$('overview-grid').innerHTML=slides.map((s,i)=>`<button data-index="${i}" class="${index===i?'active':''}"><small>${String(i+1).padStart(2,'0')} · ${s.section}</small>${s.title.replace(/<[^>]+>/g,'')}</button>`).join('');$('overview-grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{o.hidden=true;show(Number(b.dataset.index))})}}

$('prev').onclick=prev;$('next').onclick=next;$('overview-btn').onclick=overview;$('close-over').onclick=overview;$('notes-btn').onclick=()=>$('notes').hidden=!$('notes').hidden;$('fullscreen-btn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
window.addEventListener('keydown',e=>{if(!slides.length||e.target.closest('button,a,input'))return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}else if(e.key.toLowerCase()==='n')$('notes').hidden=!$('notes').hidden;else if(e.key.toLowerCase()==='o')overview();else if(e.key.toLowerCase()==='f')$('fullscreen-btn').click();else if(e.key==='Escape')$('overview').hidden=true});
window.addEventListener('hashchange',()=>{if(!slides.length)return;const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=slides.length&&n-1!==index)show(n-1)});

async function boot(){
  try{
    await loadSlides();
    const h=parseInt(location.hash.slice(1),10);
    index=h>=1&&h<=slides.length?h-1:0;
    show(index);
  }catch(err){
    console.error(err);
    $('slides').innerHTML=`<div class="load-error"><h2>Could not load the slides</h2><p>${err.message}</p><p>If you opened this file directly, serve the folder over HTTP: <code>cd public &amp;&amp; python3 -m http.server</code>, then open <code>http://localhost:8000/</code>.</p></div>`;
  }
}
boot();
</script></body></html>
